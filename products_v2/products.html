<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productos - Filtros</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Productos</h1>
      <button id="load-products">Cargar productos</button>
    </header>

    <main>
      <section class="filters">
        <h2>Filtros</h2>

        <div class="filter-group">
          <label for="name-filter">Nombre</label>
          <input type="text" id="name-filter" placeholder="Buscar por nombre" />
        </div>
      </section>

      <section class="products-section">
        <h2>Lista de productos</h2>
        <p id="products-counter"></p>
        <div id="products-container" class="products-container"></div>
      </section>
    </main>

    <script src="products.js"></script>
  </body>
</html>
